<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 100 100" version="1.1" xmlns="http://www.w3.org/2000/svg"
     xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:1.41421;">
    <rect id="Artboard1" x="0" y="0" width="100" height="100" style="fill:none;"/>
    <g transform="translate(50,50)">
        <!-- Vertical arm -->
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#BBBBBB" stroke-width="5" stroke-linecap="round"/>
        <!-- 60-degree arms -->
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#BBBBBB" stroke-width="5" stroke-linecap="round" transform="rotate(60)"/>
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#BBBBBB" stroke-width="5" stroke-linecap="round" transform="rotate(120)"/>
        <!-- Top branches -->
        <line x1="0" y1="-38" x2="-8" y2="-28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="-38" x2="8" y2="-28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round"/>
        <!-- Bottom branches -->
        <line x1="0" y1="38" x2="-8" y2="28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="38" x2="8" y2="28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round"/>
        <!-- Upper-right branches -->
        <line x1="0" y1="-38" x2="-8" y2="-28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(60)"/>
        <line x1="0" y1="-38" x2="8" y2="-28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(60)"/>
        <!-- Lower-left branches -->
        <line x1="0" y1="38" x2="-8" y2="28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(60)"/>
        <line x1="0" y1="38" x2="8" y2="28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(60)"/>
        <!-- Upper-left branches -->
        <line x1="0" y1="-38" x2="-8" y2="-28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(120)"/>
        <line x1="0" y1="-38" x2="8" y2="-28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(120)"/>
        <!-- Lower-right branches -->
        <line x1="0" y1="38" x2="-8" y2="28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(120)"/>
        <line x1="0" y1="38" x2="8" y2="28" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" transform="rotate(120)"/>
        <!-- Centre diamond -->
        <polygon points="0,-8 8,0 0,8 -8,0" fill="#BBBBBB"/>
    </g>
</svg>
